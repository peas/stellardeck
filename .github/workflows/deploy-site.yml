name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - 'demo/**'
      - 'slides2.js'
      - 'slides2.css'
      - 'packages/core/src/**'
      - 'css/**'
      - 'embed/stellar-embed.js'
      - 'vendor/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Root install builds @stellardeck/core's browser bundles (workspace
      # `prepare` → tsup); copy-engine ships dist/autoflow.global.js.
      - name: Install engine dependencies
        run: npm ci
      - name: Install site dependencies
        run: cd site && npm ci
      - name: Build site
        run: cd site && npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
