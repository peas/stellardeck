name: Publish to npm

# Publishes @stellardeck/core and stellardeck (CLI) when a v* tag is pushed.
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. Each package
# needs a Trusted Publisher configured on npmjs.com (package → Settings →
# Trusted publishing → GitHub Actions: owner `peas`, repo `stellardeck`,
# workflow `publish.yml`). npm stops accepting classic tokens for publish
# in Jan 2027, so this is the only path after that.
#
# Release: bump "version" in package.json AND packages/core/package.json,
# commit, `git tag vX.Y.Z && git push origin vX.Y.Z`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (+ provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      - name: Tag must match both package versions
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CLI=$(node -p "require('./package.json').version")
          CORE=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$TAG cli=$CLI core=$CORE"
          [ "$TAG" = "$CLI" ] && [ "$TAG" = "$CORE" ]

      # Core first: the CLI tarball bundles core's sources, but users of the
      # library install @stellardeck/core directly. Skip a version that's
      # already on the registry so a CLI-only re-run doesn't fail.
      - name: Publish @stellardeck/core
        run: |
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "@stellardeck/core@$V" version >/dev/null 2>&1; then
            echo "@stellardeck/core@$V already published — skipping"
          else
            npm publish -w @stellardeck/core --access public
          fi

      - name: Publish stellardeck
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "stellardeck@$V" version >/dev/null 2>&1; then
            echo "stellardeck@$V already published — skipping"
          else
            npm publish --access public
          fi
